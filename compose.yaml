services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apirunner
      POSTGRES_USER: apirunner
      POSTGRES_PASSWORD: local-development
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apirunner"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  database:
