server.address=127.0.0.1
server.port=${PORT:8085}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/api-test-runner;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.servlet.multipart.max-file-size=1MB
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
runner.allowed-origins=${TARGET_ORIGINS:http://127.0.0.1:8086,http://localhost:8086}
runner.demo-port=${DEMO_PORT:8086}
runner.demo-enabled=${DEMO_ENABLED:true}

spring.datasource.hikari.connection-timeout=3000
spring.jdbc.template.query-timeout=3s
