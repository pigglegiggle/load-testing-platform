<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="28" font-size="24" text-anchor="middle">Scenario execution — isolated worker loops</text><rect x="30" y="90" width="1140" height="290" fill="white" stroke="#222" stroke-dasharray="6 5"/><text x="600.0" y="240.95" font-size="17" text-anchor="middle"></text><text x="600" y="118" font-size="18" text-anchor="middle">Each concurrent worker owns its variables for the current iteration</text><rect x="70" y="185" width="240" height="90" fill="white" stroke="#222"/><text x="190.0" y="224.95" font-size="17" text-anchor="middle">Step 1: create session</text><text x="190.0" y="246.95" font-size="17" text-anchor="middle">Extract token</text><rect x="470" y="185" width="250" height="90" fill="white" stroke="#222"/><text x="595.0" y="224.95" font-size="17" text-anchor="middle">Step 2: read items</text><text x="595.0" y="246.95" font-size="17" text-anchor="middle">Use token · extract item ID</text><rect x="880" y="185" width="250" height="90" fill="white" stroke="#222"/><text x="1005.0" y="225.1" font-size="16" text-anchor="middle">Step 3: create order</text><text x="1005.0" y="246.1" font-size="16" text-anchor="middle">Use item ID · assert result</text><polyline points="310,230 470,230" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="390" y="212" font-size="15" text-anchor="middle">passed</text><polyline points="720,230 880,230" fill="none" stroke="#222" marker-end="url(#arrow)"/><text x="800" y="212" font-size="15" text-anchor="middle">passed</text><text x="600" y="333" font-size="16" text-anchor="middle">Any failed step stops that iteration. The next iteration starts with fresh variables.</text><text x="600" y="420" font-size="17" text-anchor="middle">Count mode: repeat per worker. Duration mode: repeat until the run deadline.</text><text x="600" y="455" font-size="17" text-anchor="middle">Cancellation interrupts pending HTTP work. There are no application-level retries.</text></g></svg>